
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VYBE - Video Search</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0c10;
      --panel: #15171e;
      --border: #292c36;
      --text: #f4f5f9;
      --muted: #999eae;
      --accent: #a78bfa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    header {
      height: 72px;
      padding: 0 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: #101116;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .logo span { color: var(--accent); }

    .status {
      font-size: 12px;
      color: var(--muted);
    }

    main {
      max-width: 1250px;
      margin: auto;
      padding: 45px 24px 70px;
    }

    .hero { text-align: center; margin-bottom: 34px; }

    .tag {
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    h1 {
      font-size: clamp(30px, 5vw, 48px);
      margin: 12px 0;
      letter-spacing: -1px;
    }

    .subtitle { color: var(--muted); font-size: 14px; }

    .search {
      display: flex;
      gap: 10px;
      max-width: 720px;
      margin: 28px auto 0;
    }

    input {
      min-width: 0;
      flex: 1;
      padding: 16px 18px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--panel);
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus { border-color: var(--accent); }

    button {
      border: 0;
      border-radius: 12px;
      padding: 0 24px;
      background: var(--accent);
      color: #151020;
      font-weight: 800;
      cursor: pointer;
      font-size: 14px;
    }

    button:disabled { opacity: .5; cursor: wait; }

    .player-section {
      display: none;
      margin: 42px 0;
      padding: 20px;
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 18px;
    }

    .player-section.active { display: block; }

    .player {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border: 0;
      border-radius: 12px;
      display: block;
    }

    .now-title {
      font-size: 20px;
      margin: 16px 0 6px;
    }

    .now-channel { color: var(--muted); font-size: 13px; }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 35px 0 20px;
    }

    .section-head h2 { font-size: 20px; margin: 0; }

    #count { color: var(--muted); font-size: 13px; }

    .results {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    .video-card {
      min-width: 0;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 15px;
      overflow: hidden;
      transition: transform .18s, border-color .18s;
    }

    .video-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }

    .video-card.selected { border-color: var(--accent); }

    .thumb-wrap {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #22242c;
    }

    .thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .play {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 36px;
      text-shadow: 0 2px 12px #000;
      background: #00000012;
    }

    .video-info { padding: 14px; }

    .video-title {
      font-size: 14px;
      font-weight: 750;
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: anywhere;
    }

    .channel {
      color: var(--muted);
      font-size: 12px;
      margin-top: 9px;
    }

    .message {
      color: var(--muted);
      text-align: center;
      padding: 42px 12px;
      line-height: 1.8;
      grid-column: 1 / -1;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 25px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 850px) {
      .results { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 520px) {
      header { padding: 0 18px; }
      main { padding: 32px 15px 50px; }
      .search { gap: 7px; }
      .search input { padding: 14px 11px; }
      .search button { padding: 0 15px; }
      .results { grid-template-columns: 1fr; gap: 15px; }
      .video-card { display: grid; grid-template-columns: 43% 1fr; }
      .thumb-wrap { height: 100%; min-height: 100px; aspect-ratio: auto; }
      .video-info { padding: 10px; }
      .video-title { font-size: 13px; }
      .player-section { padding: 12px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">VYBE<span>.</span></div>

  <form id="urlForm" class="url-bar">
    <input
      id="urlInput"
      type="text"
      placeholder="https://example.com"
      aria-label="開きたいURL"
    >
    <button type="submit">開く ↗</button>
  </form>

  <div class="status">VIDEO DISCOVERY</div>
</header>


  <main>
    <section class="hero">
      <div class="tag">YOUR VIDEO SPACE</div>
      <h1>好きな動画を、見つけよう。</h1>
      <div class="subtitle">
        YouTubeの動画を検索して、このページ内で再生できます。
      </div>

      <form class="search" id="searchForm">
        <input
          id="query"
          type="search"
          placeholder="見たい動画を検索..."
          aria-label="動画を検索"
          required
        >
        <button id="searchButton" type="submit">検索 →</button>
      </form>
    </section>

    <section class="player-section" id="playerSection">
      <iframe
        id="player"
        class="player"
        title="YouTube動画プレイヤー"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>
      <h2 class="now-title" id="nowTitle"></h2>
      <div class="now-channel" id="nowChannel"></div>
    </section>

    <section>
      <div class="section-head">
        <h2 id="resultHeading">動画を検索</h2>
        <span id="count"></span>
      </div>
      <div class="results" id="results">
        <div class="message">
          上の検索欄にキーワードを入力してみよう！<br>
          例：ボカロ、ゲーム実況、音楽
        </div>
      </div>
    </section>
  </main>

  <footer>
    VYBE. · 動画検索ポータル<br>
    動画の配信・再生はYouTubeのサービスを利用しています。
  </footer>

  <script>
    // Google Cloudで作成したAPIキーを設定してください。
    // このHTMLを公開すると、キーを他人に見られる可能性があります。
    const API_KEY = "AIzaSyA5k2XbJv4Gj1B3mnSwQENsK-LLiwpY4DY";

    const form = document.getElementById("searchForm");
    const queryInput = document.getElementById("query");
    const searchButton = document.getElementById("searchButton");
    const results = document.getElementById("results");
    const count = document.getElementById("count");
    const heading = document.getElementById("resultHeading");
    const playerSection = document.getElementById("playerSection");
    const player = document.getElementById("player");
    const nowTitle = document.getElementById("nowTitle");
    const nowChannel = document.getElementById("nowChannel");

    let videos = [];

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const query = queryInput.value.trim();
      if (!query) return;

      if (!API_KEY || API_KEY === "ここにAPIキーを入力") {
        showMessage("まずコード内のAPI_KEYに、自分のAPIキーを設定してください。");
        return;
      }

      searchButton.disabled = true;
      searchButton.textContent = "検索中...";
      heading.textContent = "検索結果";
      count.textContent = "";
      results.innerHTML = '<div class="message">動画を探しています...</div>';

      try {
        const params = new URLSearchParams({
          part: "snippet",
          type: "video",
          maxResults: "12",
          q: query,
          regionCode: "JP",
          relevanceLanguage: "ja",
          safeSearch: "moderate",
          key: API_KEY
        });

        const response = await fetch(
          "https://www.googleapis.com/youtube/v3/search?" + params
        );

        const data = await response.json();

        if (!response.ok) {
          const apiMessage = data.error?.message || "APIリクエストに失敗しました。";
          throw new Error(apiMessage);
        }

        videos = (data.items || []).filter(item => item.id?.videoId);

        if (videos.length === 0) {
          showMessage("動画が見つかりませんでした。別のキーワードを試してね。");
          return;
        }

        renderVideos(videos);
        count.textContent = `${videos.length} 件`;
        heading.textContent = `「${query}」の検索結果`;

      } catch (error) {
        console.error(error);
        showMessage(
          "検索に失敗しました。\n" +
          error.message +
          "\nAPIキー・APIの制限・利用枠を確認してください。"
        );
      } finally {
        searchButton.disabled = false;
        searchButton.textContent = "検索 →";
      }
    });

    function renderVideos(items) {
      results.innerHTML = "";

      items.forEach((item) => {
        const videoId = item.id.videoId;
        const snippet = item.snippet;
        const title = snippet.title || "タイトルなし";
        const channel = snippet.channelTitle || "";
        const thumbnail =
          snippet.thumbnails?.high?.url ||
          snippet.thumbnails?.medium?.url ||
          snippet.thumbnails?.default?.url ||
          "";

        const card = document.createElement("article");
        card.className = "video-card";
        card.tabIndex = 0;
        card.setAttribute("role", "button");
        card.setAttribute("aria-label", `${title} を再生`);

        const thumbWrap = document.createElement("div");
        thumbWrap.className = "thumb-wrap";

        const img = document.createElement("img");
        img.className = "thumb";
        img.src = thumbnail;
        img.alt = "";
        img.loading = "lazy";

        const playIcon = document.createElement("div");
        playIcon.className = "play";
        playIcon.textContent = "▶";

        thumbWrap.append(img, playIcon);

        const info = document.createElement("div");
        info.className = "video-info";

        const titleEl = document.createElement("div");
        titleEl.className = "video-title";
        titleEl.textContent = title;

        const channelEl = document.createElement("div");
        channelEl.className = "channel";
        channelEl.textContent = channel;

        info.append(titleEl, channelEl);
        card.append(thumbWrap, info);

        const play = () => {
          playVideo(videoId, title, channel, card);
        };

        card.addEventListener("click", play);
        card.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            play();
          }
        });

        results.appendChild(card);
      });
    }

    function playVideo(videoId, title, channel, card) {
      // YouTubeの埋め込みプレイヤーで動画を再生します。
      player.src =
        "https://www.youtube.com/embed/" +
        encodeURIComponent(videoId) +
        "?autoplay=1";

      nowTitle.textContent = title;
      nowChannel.textContent = channel;
      playerSection.classList.add("active");

      document.querySelectorAll(".video-card").forEach(el => {
        el.classList.remove("selected");
      });
      card.classList.add("selected");

      playerSection.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    function showMessage(message) {
      results.innerHTML = "";
      const box = document.createElement("div");
      box.className = "message";
      box.style.whiteSpace = "pre-line";
      box.textContent = message;
      results.appendChild(box);
      count.textContent = "";
    }
    
document.getElementById("urlForm").addEventListener("submit", (event) => {
  event.preventDefault();

  let value = document.getElementById("urlInput").value.trim();

  if (!value) return;

  if (!/^https?:\/\//i.test(value)) {
    value = "https://" + value;
  }

  try {
    const url = new URL(value);

    if (url.protocol !== "https:" && url.protocol !== "http:") {
      alert("http または https のURLを入力してください。");
      return;
    }

    window.open(url.href, "_blank", "noopener,noreferrer");
  } catch {
    alert("URLが正しいか確認してください。");
  }
});

  </script>
</body>
</html>
